# App Config
assemble.bootstrap=true
assemble.superuser.username=${SUPERUSER_USERNAME:assemble}
assemble.superuser.password=${SUPERUSER_PASSWORD:password}
# Spring Config
spring.application.name=backend
server.port=8080
spring.devtools.add-properties=false
spring.devtools.livereload.enabled=false
logging.level.org.springframework=WARN
# MongoDB Config
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=assemble
spring.data.mongodb.auto-index-creation=true
# PostgreSQL Config
spring.datasource.url=${POSTGRES_URI}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.pool-name=Postgres-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.open-in-view=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.formal_sql=false
# Session
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.platform=postgresql
spring.session.jdbc.schema=classpath:postgres/schema-@@platform@@.sql
spring.session.jdbc.table-name=SESSIONS
spring.session.jdbc.cleanup-cron=0 0 * * * *
spring.session.timeout=120m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.domain=assemble-frontend-latest.onrender.com
# Migration
spring.flyway.url=${POSTGRES_URI}
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.driver-class-name=org.postgresql.Driver
# OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

