# App Config
assemble.bootstrap=false
# Spring Config
spring.application.name=backend
server.port=8080
# MongoDB Config
spring.data.mongodb.uri=${MONGO_URI:mongodb://admin:password@localhost:27017}
spring.data.mongodb.database=assemble
spring.data.mongodb.auto-index-creation=true
# PostgreSQL Config
spring.datasource.url=${POSTGRES_URI:jdbc:postgresql://localhost:5432/assemble}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.hikari.pool-name=Postgres-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.open-in-view=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.formal_sql=true
# Security
logging.level.org.springframework.security=DEBUG
# Session
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.platform=postgresql
spring.session.jdbc.schema=classpath:postgres/schema-@@platform@@.sql
spring.session.jdbc.table-name=SESSIONS
spring.session.jdbc.cleanup-cron=0 * * * * *
spring.session.timeout=120m
server.servlet.session.cookie.domain=localhost
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=true
logging.level.org.springframework.session=DEBUG
#Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.driver-class-name=org.postgresql.Driver
